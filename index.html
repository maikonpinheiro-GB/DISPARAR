<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESPELHA AÍ - Positivus Style</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Space Grotesk"', 'sans-serif'] },
                    colors: {
                        brand: {
                            green: '#B9FF66',
                            dark: '#191A23',
                            light: '#F3F3F3',
                            white: '#FFFFFF'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { background-color: #F3F3F3; color: #191A23; overflow-x: hidden; }
        
        .brutal-border { border: 2px solid #191A23; }
        .brutal-shadow { box-shadow: 6px 6px 0px 0px #191A23; transition: all 0.2s ease; }
        .brutal-shadow:hover { box-shadow: 2px 2px 0px 0px #191A23; transform: translate(4px, 4px); }
        .brutal-shadow:active { box-shadow: 0px 0px 0px 0px #191A23; transform: translate(6px, 6px); }

        .brutal-shadow-static { box-shadow: 8px 8px 0px 0px #191A23; }

        /* Moldura do Celular */
        .phone-frame {
            width: 100%; max-width: 420px; aspect-ratio: 9/19.5; 
            background: #191A23; border-radius: 3rem; 
            border: 8px solid #191A23; 
            position: relative; overflow: hidden;
            display: flex; flex-direction: column;
            margin: 0 auto;
        }
        #android-screen { width: 100%; height: 100%; object-fit: fill; cursor: crosshair; background: #000; }
        
        .loader { border: 4px solid #191A23; border-top-color: #B9FF66; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #F3F3F3; border-left: 2px solid #191A23; }
        ::-webkit-scrollbar-thumb { background: #B9FF66; border-left: 2px solid #191A23; border-bottom: 2px solid #191A23; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-brand-green selection:text-brand-dark">

    <header class="w-full bg-brand-white brutal-border border-b-2 py-4 px-6 md:px-12 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-brand-green brutal-border rounded-full flex items-center justify-center text-xl">
                <i class="fa-solid fa-mobile-screen"></i>
            </div>
            <h1 class="font-bold text-2xl tracking-tighter">Espelha<span class="text-brand-green bg-brand-dark px-1 ml-1 rounded">AÍ</span></h1>
        </div>
        
        <div class="flex items-center gap-4">
            <div id="status-badge" class="hidden items-center gap-2 px-4 py-2 bg-brand-white brutal-border rounded-full brutal-shadow-static shadow-[4px_4px_0px_0px_#191A23]">
                <div class="w-3 h-3 rounded-full bg-brand-green animate-pulse brutal-border"></div>
                <span class="text-sm font-bold">Online & Lincado</span>
            </div>
            <button id="btn-conectar" onclick="conectarUSB()" class="bg-brand-dark text-brand-white px-6 py-3 rounded-xl font-bold text-sm brutal-shadow brutal-border hover:bg-brand-green hover:text-brand-dark flex items-center gap-2">
                <i class="fa-brands fa-usb text-lg"></i> Conectar Aparelho
            </button>
        </div>
    </header>

    <main class="flex-1 w-full mx-auto p-6 md:p-12 flex flex-col items-center justify-center relative">
        
        <div class="flex flex-col items-center justify-center relative w-full">
            
            <!-- Celular Gigante no Centro Exato -->
            <div class="phone-frame brutal-shadow-static" id="touch-area">
                <!-- Overlay pré-conexão -->
                <div id="screen-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-brand-dark z-10 text-brand-green p-8 text-center">
                    <i class="fa-brands fa-usb text-6xl mb-6"></i>
                    <h3 class="text-2xl font-bold mb-2">Aguardando Conexão</h3>
                    <p class="text-sm text-brand-light/70">Clique em Conectar Aparelho no topo. O vídeo iniciará sozinho.</p>
                </div>
                
                <!-- Imagem do Espelhamento -->
                <img id="android-screen" src="" alt="">
            </div>

            <!-- Botões Virtuais Android -->
            <div class="flex gap-4 mt-8">
                <button onclick="runAdbShell('input keyevent 4')" class="w-14 h-14 bg-brand-white brutal-border brutal-shadow rounded-full flex items-center justify-center text-xl hover:bg-brand-green transition-colors"><i class="fa-solid fa-angle-left"></i></button>
                <button onclick="runAdbShell('input keyevent 3')" class="w-14 h-14 bg-brand-white brutal-border brutal-shadow rounded-full flex items-center justify-center text-xl hover:bg-brand-green transition-colors"><i class="fa-regular fa-circle"></i></button>
                <button onclick="runAdbShell('input keyevent 187')" class="w-14 h-14 bg-brand-white brutal-border brutal-shadow rounded-full flex items-center justify-center text-xl hover:bg-brand-green transition-colors"><i class="fa-solid fa-bars"></i></button>
            </div>
            
            <!-- Botão Enviar Arquivo (Minimalista) -->
            <div class="mt-8 w-full max-w-[420px] flex flex-col gap-4">
                <button onclick="document.getElementById('file-input').click()" class="w-full bg-brand-dark text-brand-green py-4 rounded-xl font-bold brutal-border brutal-shadow flex items-center justify-center gap-2 hover:bg-brand-green hover:text-brand-dark transition-colors">
                    <i class="fa-solid fa-cloud-arrow-up text-xl"></i> Enviar Arquivo
                </button>
                <input type="file" id="file-input" class="hidden" onchange="injetarArquivoUniversal(this)">

                <div id="upload-indicator" class="hidden bg-brand-light brutal-border p-4 rounded-xl flex items-center gap-3">
                    <div class="loader"></div>
                    <span class="text-sm font-bold">Injetando arquivo no sistema...</span>
                </div>
            </div>
            
        </div>
        
    </main>

    <div id="toast-container" class="fixed bottom-8 right-8 z-50 flex flex-col gap-4 pointer-events-none"></div>

    <script>
        // === VARIÁVEIS GLOBAIS ===
        let usbDevice = null;
        let epIn = null;
        let epOut = null;
        let isAdbReady = false;
        let localIdCounter = 1;
        let radarAtivo = false;
        let transferindo = false;
        let wakeLock = null;

        // --- PREVENÇÃO DE SUSPENSÃO DE TELA (WAKE LOCK) ---
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); }
            } catch (err) {}
        }
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && isAdbReady) requestWakeLock();
        });

        // --- SISTEMA DE TOAST (ESTILO POSITIVUS) ---
        function showToast(msg, isError = false) {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            const bgClass = isError ? 'bg-[#FF4D4D] text-white' : 'bg-brand-white text-brand-dark';
            const icon = isError ? 'fa-triangle-exclamation' : 'fa-check';
            
            t.className = `${bgClass} brutal-border brutal-shadow-static shadow-[4px_4px_0px_0px_#191A23] px-6 py-4 rounded-xl flex items-center gap-3 transform transition-all duration-300 translate-y-10 opacity-0 pointer-events-auto`;
            t.innerHTML = `<i class="fa-solid ${icon} text-lg"></i><span class="font-bold text-sm">${msg}</span>`;
            c.appendChild(t);
            
            requestAnimationFrame(() => t.classList.remove('translate-y-10', 'opacity-0'));
            setTimeout(() => { t.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => t.remove(), 300); }, 4000);
        }

        // --- TECLADO GLOBAL FANTASMA ---
        window.addEventListener('keydown', async (e) => {
            if (!isAdbReady || transferindo) return;
            if (e.ctrlKey || e.altKey || e.metaKey) return; 

            let cmd = '';
            if (e.key === 'Backspace') {
                cmd = 'input keyevent 67';
                e.preventDefault();
            } else if (e.key === 'Enter') {
                cmd = 'input keyevent 66';
                e.preventDefault();
            } else if (e.key === ' ') {
                cmd = 'input keyevent 62';
                e.preventDefault();
            } else if (e.key.length === 1) {
                let char = e.key.replace(/"/g, '\\"').replace(/'/g, "\\'").replace(/&/g, "\\&");
                cmd = `input text "${char}"`;
            }

            if (cmd) await runAdbShell(cmd);
        });

        // --- INTERAÇÃO DE MOUSE NA TELA ---
        document.getElementById('touch-area').addEventListener('mousedown', async function(e) {
            if (!isAdbReady) return;
            const img = document.getElementById('android-screen');
            if(!img.src) return;

            const rect = img.getBoundingClientRect();
            const percX = (e.clientX - rect.left) / rect.width;
            const percY = (e.clientY - rect.top) / rect.height;

            const finalX = Math.floor(percX * 1080);
            const finalY = Math.floor(percY * 2400);

            await runAdbShell(`input tap ${finalX} ${finalY}`);
        });

        // --- INJEÇÃO UNIVERSAL DE ARQUIVOS ---
        async function injetarArquivoUniversal(input) {
            if (!isAdbReady) return showToast("Conecte o USB primeiro.", true);
            if (input.files.length === 0) return;
            
            const file = input.files[0];
            if (file.size > 3 * 1024 * 1024) {
                input.value = '';
                return showToast("Limite de 3MB excedido. Escolha um arquivo menor.", true);
            }

            transferindo = true;
            const radarAntigo = radarAtivo;
            radarAtivo = false; 
            document.getElementById('upload-indicator').classList.remove('hidden');

            try {
                const base64 = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });

                const nomeSeguro = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
                const pathTmp = `/sdcard/temp_upload.txt`;
                const pathFinal = `/sdcard/Download/${nomeSeguro}`;

                await runAdbShell(`rm -f ${pathTmp}`);
                
                const chunkSize = 2048;
                for (let i = 0; i < base64.length; i += chunkSize) {
                    const chunk = base64.substring(i, i + chunkSize);
                    await runAdbShell(`echo -n '${chunk}' >> ${pathTmp}`);
                }

                await runAdbShell(`base64 -d ${pathTmp} > ${pathFinal}`);
                await runAdbShell(`rm -f ${pathTmp}`);

                // Desperta a tela e lança o menu de compartilhamento do Android
                await runAdbShell("input keyevent 224"); 
                const intentCmd = `am start -a android.intent.action.SEND -t "*/*" -f 1 --eu android.intent.extra.STREAM "file://${pathFinal}"`;
                await runAdbShell(intentCmd);

                showToast("Arquivo injetado! Escolha o aplicativo na tela.");
            } catch (err) {
                showToast("Erro ao transferir: " + err.message, true);
            }

            document.getElementById('upload-indicator').classList.add('hidden');
            input.value = '';
            transferindo = false;
            
            if(radarAntigo) { radarAtivo = true; loopRadarBinario(); }
        }

        async function loopRadarBinario() {
            if (!radarAtivo || transferindo) return;
            
            try {
                const myId = localIdCounter++;
                // Extrai pixels RAW empacotados em PNG do terminal
                await sendPacket(0x4E45504F, myId, 0, new TextEncoder().encode("exec:screencap -p\0"));
                
                let chunks = [];
                let waitClose = true;

                while(waitClose && radarAtivo) {
                    let r = await readPacket();
                    if(!r || r.error) break;
                    
                    if(r.cmd === 0x45545257 && r.arg1 === myId) { // WRTE Payload
                        await sendPacket(0x59414B4F, myId, r.arg0); // Confirma recebimento
                        if(r.data && r.data.length > 0) chunks.push(r.data);
                    }
                    if(r.cmd === 0x45534C43 && r.arg1 === myId) { // CLSE Encerramento
                        await sendPacket(0x45534C43, myId, r.arg0);
                        waitClose = false;
                    }
                }

                if (chunks.length > 0) {
                    // Agrupa todos os pacotes fatiados pelo USB em um buffer só
                    const totalLen = chunks.reduce((acc, c) => acc + c.length, 0);
                    const imgData = new Uint8Array(totalLen);
                    let offset = 0;
                    for(let c of chunks) { imgData.set(c, offset); offset += c.length; }
                    
                    // SEGURANÇA MÁXIMA: Verifica os "Magic Bytes" do PNG (89 50 4E 47)
                    // Só atualiza a tela SE o arquivo estiver íntegro, evitando tela preta/flickering
                    if (imgData.length > 8 && imgData[0] === 0x89 && imgData[1] === 0x50) {
                        const blob = new Blob([imgData], { type: 'image/png' });
                        const url = URL.createObjectURL(blob);
                        const img = document.getElementById('android-screen');
                        
                        const tempImg = new Image();
                        tempImg.onload = () => {
                            if (img.dataset.oldUrl) URL.revokeObjectURL(img.dataset.oldUrl);
                            img.src = url;
                            img.dataset.oldUrl = url;
                        };
                        tempImg.src = url;
                    }
                }
            } catch (e) { console.error(e); }

            // Loop Ultra Rápido (30ms vs 800ms antigos)
            setTimeout(loopRadarBinario, 30); 
        }

        async function getAdbKeyPair() { 
            return await crypto.subtle.generateKey({ name: "RSASSA-PKCS1-v1_5", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" }, true, ["sign", "verify"]); 
        }
        async function signAdbToken(keyPair, token) { 
            return new Uint8Array(await crypto.subtle.sign("RSASSA-PKCS1-v1_5", keyPair.privateKey, token)); 
        }
        async function getAdbPublicKeyPayload(keyPair) {
            const exported = await crypto.subtle.exportKey("jwk", keyPair.publicKey);
            const binaryStr = atob(exported.n.replace(/-/g, '+').replace(/_/g, '/'));
            const modBytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) modBytes[i] = binaryStr.charCodeAt(i);
            let n = 0n; for (let i = 0; i < modBytes.length; i++) n = (n << 8n) | BigInt(modBytes[i]);
            const r32 = 1n << 32n, n0 = n % r32;
            let inv = 1n; for (let i = 0; i < 32; i++) inv = (inv * (2n - n0 * inv)) % r32;
            const buffer = new ArrayBuffer(524), view = new DataView(buffer), bytes = new Uint8Array(buffer);
            view.setUint32(0, 64, true); view.setUint32(4, Number((r32 - inv) % r32), true);
            let tempN = n; for (let i = 0; i < 256; i++) { bytes[8 + i] = Number(tempN & 0xffn); tempN >>= 8n; }
            let tempRR = ((1n << 2048n) * (1n << 2048n)) % n; for (let i = 0; i < 256; i++) { bytes[264 + i] = Number(tempRR & 0xffn); tempRR >>= 8n; }
            view.setUint32(520, 65537, true);
            const nameBytes = new TextEncoder().encode("EspelhaAi_Positivus\0");
            const fullPayload = new Uint8Array(buffer.byteLength + nameBytes.length);
            fullPayload.set(bytes, 0); fullPayload.set(nameBytes, buffer.byteLength); 
            return fullPayload;
        }
        async function sendPacket(cmd, arg0, arg1, data = new Uint8Array(0)) {
            if (!usbDevice || !epOut) return;
            const header = new ArrayBuffer(24), view = new DataView(header);
            let checksum = 0; for (let i = 0; i < data.length; i++) checksum = (checksum + data[i]) & 0xffffffff;
            view.setUint32(0, cmd, true); view.setUint32(4, arg0, true); view.setUint32(8, arg1, true);
            view.setUint32(12, data.length, true); view.setUint32(16, checksum, true); view.setUint32(20, (cmd ^ 0xffffffff) >>> 0, true);
            const buffer = new Uint8Array(24 + data.length); 
            buffer.set(new Uint8Array(header), 0); buffer.set(data, 24);
            await usbDevice.transferOut(epOut, buffer);
        }
        
        // LEITURA REFORÇADA (Evita tela preta por pacote fracionado pelo Windows/USB)
        async function readPacket() {
            if (!usbDevice || !epIn) return null;
            try {
                const head = await usbDevice.transferIn(epIn, 24);
                if (!head.data || head.data.byteLength < 24) return null;
                const view = new DataView(head.data.buffer);
                const cmd = view.getUint32(0, true), arg0 = view.getUint32(4, true), arg1 = view.getUint32(8, true), len = view.getUint32(12, true);
                
                let payload = new Uint8Array(len);
                let bytesLidos = 0;
                while (bytesLidos < len) {
                    const dat = await usbDevice.transferIn(epIn, len - bytesLidos);
                    if (dat.data && dat.data.byteLength > 0) {
                        payload.set(new Uint8Array(dat.data.buffer), bytesLidos);
                        bytesLidos += dat.data.byteLength;
                    } else break;
                }
                return { cmd, arg0, arg1, data: payload, len };
            } catch (e) { return { error: true, msg: e.message }; }
        }

        async function conectarUSB() {
            try {
                usbDevice = await navigator.usb.requestDevice({ filters: [{ classCode: 255, subclassCode: 66, protocolCode: 1 }] });
                await usbDevice.open();
                if (usbDevice.configuration === null) await usbDevice.selectConfiguration(1);
                let intfNum = -1;
                for (const conf of usbDevice.configurations) { for (const intf of conf.interfaces) { for (const alt of intf.alternates) {
                    if (alt.interfaceClass === 255 && alt.interfaceSubclass === 66 && alt.interfaceProtocol === 1) {
                        intfNum = intf.interfaceNumber; epIn = alt.endpoints.find(e => e.direction === 'in').endpointNumber; epOut = alt.endpoints.find(e => e.direction === 'out').endpointNumber; break;
                    } 
                } } }
                
                await usbDevice.claimInterface(intfNum);
                await sendPacket(0x4E584E43, 0x01000000, 4096, new TextEncoder().encode("host::EspelhaAi\0"));
                
                let keyPair = await getAdbKeyPair();
                let resp = await readPacket();
                
                if (resp && resp.cmd === 0x4E584E43) isAdbReady = true; 
                else if (resp && resp.cmd === 0x48545541 && resp.arg0 === 1) { 
                    await sendPacket(0x48545541, 2, 0, await signAdbToken(keyPair, resp.data));
                    let resp2 = await readPacket();
                    if (resp2 && resp2.cmd === 0x4E584E43) isAdbReady = true;
                    else {
                        await sendPacket(0x48545541, 3, 0, await getAdbPublicKeyPayload(keyPair));
                        showToast("Atenção: Aceite a depuração na tela do celular!", true);
                        while(!isAdbReady) { 
                            let waitResp = await readPacket(); 
                            if(waitResp && waitResp.error) return showToast("Aparelho desconectado.", true); 
                            if(waitResp && waitResp.cmd === 0x4E584E43) isAdbReady = true; 
                        }
                    }
                }
                
                if (isAdbReady) {
                    // Atualiza UI
                    document.getElementById('status-badge').classList.remove('hidden');
                    document.getElementById('status-badge').classList.add('flex');
                    document.getElementById('btn-conectar').classList.add('hidden');
                    document.getElementById('screen-overlay').classList.add('hidden');
                    
                    showToast("Celular Conectado! Espelhamento iniciado.");
                    
                    // Trava telas
                    requestWakeLock();
                    await runAdbShell("settings put global stay_on_while_plugged_in 3"); 
                    await runAdbShell("settings put system screen_off_timeout 2147483647"); 
                    await runAdbShell("input keyevent 224"); 
                    
                    // INICIA O VÍDEO AUTOMATICAMENTE AQUI
                    radarAtivo = true;
                    loopRadarBinario();
                }
            } catch (e) { showToast("Erro USB: " + e.message, true); }
        }
        
        async function runAdbShell(command) {
            if (!isAdbReady) return false;
            try {
                const myId = localIdCounter++;
                await sendPacket(0x4E45504F, myId, 0, new TextEncoder().encode("shell:" + command + "\0"));
                for(let i = 0; i < 4; i++) {
                    let r = await readPacket(); 
                    if(r && r.error) continue;
                    if(r && r.cmd === 0x45534C43) { await sendPacket(0x45534C43, myId, r.arg0); break; }
                }
                return true;
            } catch(e) { return false; }
        }
        window.runAdbShell = runAdbShell;
    </script>
</body>
</html>
