<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espelha Aí - Controle Supremo</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0F172A; color: #F8FAFC; overflow: hidden; }
        
        /* Estilização do Menu Lateral */
        .sidebar { background-color: #1E293B; border-right: 1px solid #334155; }
        .nav-item { transition: all 0.2s ease; }
        .nav-item:hover { background-color: #334155; color: #38BDF8; transform: translateX(5px); }
        
        /* Moldura do Celular Gigante */
        .phone-frame {
            width: 100%; max-width: 450px; aspect-ratio: 9/19.5; 
            background: #000; border-radius: 2.5rem; 
            border: 12px solid #0F172A; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px #334155;
            position: relative; overflow: hidden;
            display: flex; flex-direction: column;
        }
        #android-screen { width: 100%; height: 100%; object-fit: fill; cursor: crosshair; }
        
        /* Loading Spinner */
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .loader { border: 3px solid rgba(56, 189, 248, 0.2); border-top-color: #38BDF8; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
    </style>
</head>
<body class="flex h-screen w-screen selection:bg-sky-500/30">

    <!-- MENU LATERAL (Sidebar) -->
    <aside class="sidebar w-20 md:w-64 h-full flex flex-col justify-between py-6 z-20 shrink-0">
        <div>
            <div class="px-6 mb-10 flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-sky-500 flex items-center justify-center shadow-lg shadow-sky-500/20 shrink-0">
                    <i class="fa-solid fa-mobile-screen text-white text-xl"></i>
                </div>
                <h1 class="font-bold text-xl hidden md:block tracking-tight text-white">Espelha<span class="text-sky-400">Aí</span></h1>
            </div>

            <nav class="flex flex-col gap-2 px-3">
                <button onclick="conectarUSB()" id="btn-conectar" class="nav-item flex items-center gap-4 px-4 py-3 rounded-lg text-gray-400 w-full text-left">
                    <i class="fa-brands fa-usb text-lg w-5 text-center"></i>
                    <span class="font-medium hidden md:block">Conectar Aparelho</span>
                </button>
                <button onclick="toggleRadar()" id="btn-radar" class="nav-item flex items-center gap-4 px-4 py-3 rounded-lg text-gray-400 w-full text-left">
                    <i class="fa-solid fa-play text-lg w-5 text-center"></i>
                    <span class="font-medium hidden md:block">Ligar Espelhamento</span>
                </button>
                <button onclick="document.getElementById('file-input').click()" class="nav-item flex items-center gap-4 px-4 py-3 rounded-lg text-gray-400 w-full text-left relative group">
                    <i class="fa-solid fa-cloud-arrow-up text-lg w-5 text-center"></i>
                    <span class="font-medium hidden md:block">Enviar Arquivo Livre</span>
                    <input type="file" id="file-input" class="hidden" onchange="injetarArquivoUniversal(this)">
                </button>
            </nav>
        </div>

        <div class="px-6">
            <div id="status-box" class="hidden flex-col gap-1 text-sm bg-slate-800 p-4 rounded-xl border border-slate-700">
                <div class="flex items-center gap-2 text-emerald-400">
                    <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                    <span class="font-bold">Aparelho Online</span>
                </div>
                <p class="text-xs text-gray-400 mt-2 hidden md:block">Teclado global ativado. Basta digitar.</p>
            </div>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL (Celular Gigante Centralizado) -->
    <main class="flex-1 h-full bg-[#0F172A] relative flex flex-col items-center justify-center p-6">
        
        <!-- Background Decorativo -->
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-800/40 via-[#0F172A] to-[#0F172A] pointer-events-none"></div>

        <div class="flex items-center gap-8 w-full max-w-5xl justify-center z-10 relative">
            
            <!-- Celular -->
            <div class="phone-frame" id="touch-area">
                <div id="screen-overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-slate-900/90 backdrop-blur-md z-10">
                    <i class="fa-solid fa-plug text-4xl text-slate-600 mb-4"></i>
                    <p class="text-sm font-medium text-slate-400 text-center px-6">Conecte o USB no menu lateral e inicie o vídeo.</p>
                </div>
                <!-- Barra de Status Falsa (Estética) -->
                <div class="h-6 w-full absolute top-0 left-0 z-20 flex justify-between items-center px-5 pointer-events-none">
                    <span class="text-[10px] font-bold text-white drop-shadow-md">EspelhaAí</span>
                    <div class="flex gap-1.5 text-white drop-shadow-md text-[10px]">
                        <i class="fa-solid fa-wifi"></i>
                        <i class="fa-solid fa-battery-full"></i>
                    </div>
                </div>
                <img id="android-screen" src="" alt="">
            </div>

            <!-- Botões de Navegação Android (Ficam do lado de fora para não atrapalhar a tela) -->
            <div class="flex flex-col gap-4">
                <button onclick="runAdbShell('input keyevent 4')" class="w-14 h-14 bg-slate-800 hover:bg-sky-500 hover:text-white rounded-2xl border border-slate-700 flex items-center justify-center text-slate-400 text-xl transition-all shadow-lg" title="Voltar">
                    <i class="fa-solid fa-angle-left"></i>
                </button>
                <button onclick="runAdbShell('input keyevent 3')" class="w-14 h-14 bg-slate-800 hover:bg-sky-500 hover:text-white rounded-2xl border border-slate-700 flex items-center justify-center text-slate-400 text-xl transition-all shadow-lg" title="Home">
                    <i class="fa-regular fa-circle"></i>
                </button>
                <button onclick="runAdbShell('input keyevent 187')" class="w-14 h-14 bg-slate-800 hover:bg-sky-500 hover:text-white rounded-2xl border border-slate-700 flex items-center justify-center text-slate-400 text-xl transition-all shadow-lg" title="Recentes">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>

        <!-- Indicador de Transferência de Arquivo -->
        <div id="upload-indicator" class="absolute bottom-10 bg-slate-800 border border-slate-700 px-6 py-4 rounded-2xl shadow-2xl hidden items-center gap-4 z-50">
            <div class="loader"></div>
            <div class="flex flex-col">
                <span class="text-sm font-bold text-white">Transferindo Arquivo...</span>
                <span class="text-xs text-sky-400">Injetando no Android e abrindo seletor</span>
            </div>
        </div>
    </main>

    <!-- Container Toasts -->
    <div id="toast-container" class="fixed top-6 right-6 z-50 flex flex-col gap-3 pointer-events-none"></div>

    <script>
        // === VARIÁVEIS NÚCLEO ===
        let usbDevice = null;
        let epIn = null;
        let epOut = null;
        let isAdbReady = false;
        let localIdCounter = 1;
        let radarAtivo = false;
        let transferindo = false;
        let wakeLock = null;

        // --- MANTER TELA DO PC ACESA ---
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
            } catch (err) {}
        }
        
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && isAdbReady) {
                requestWakeLock();
            }
        });

        // UI Toast
        function showToast(msg, isError = false) {
            const c = document.getElementById('toast-container');
            const t = document.createElement('div');
            const color = isError ? 'bg-red-500/10 border-red-500 text-red-400' : 'bg-slate-800 border-slate-700 text-slate-200';
            t.className = `${color} border px-5 py-3 rounded-xl shadow-xl flex items-center gap-3 transform transition-all duration-300 translate-x-10 opacity-0 pointer-events-auto text-sm font-medium`;
            t.innerHTML = `<i class="fa-solid ${isError ? 'fa-triangle-exclamation' : 'fa-circle-info'}"></i> ${msg}`;
            c.appendChild(t);
            requestAnimationFrame(() => t.classList.remove('translate-x-10', 'opacity-0'));
            setTimeout(() => { t.classList.add('translate-x-10', 'opacity-0'); setTimeout(() => t.remove(), 300); }, 3000);
        }

        // === 1. TECLADO GLOBAL (FANTASMA) ===
        // Ouve TUDO que for digitado na página, exceto atalhos (Ctrl, Alt)
        window.addEventListener('keydown', async (e) => {
            if (!isAdbReady || transferindo) return;
            if (e.ctrlKey || e.altKey || e.metaKey) return; 

            let cmd = '';
            
            if (e.key === 'Backspace') {
                cmd = 'input keyevent 67';
                e.preventDefault();
            } else if (e.key === 'Enter') {
                cmd = 'input keyevent 66';
                e.preventDefault();
            } else if (e.key === ' ') {
                cmd = 'input keyevent 62';
                e.preventDefault();
            } else if (e.key.length === 1) {
                // É um caractere digitável. Escapa aspas e espaços.
                let char = e.key.replace(/"/g, '\\"').replace(/'/g, "\\'").replace(/&/g, "\\&");
                cmd = `input text "${char}"`;
            }

            if (cmd) await runAdbShell(cmd);
        });

        // === 2. ENVIO DE ARQUIVOS (MÉTODO UNIVERSAL SHARE SHEET) ===
        async function injetarArquivoUniversal(input) {
            if (!isAdbReady) return showToast("Conecte o USB primeiro.", true);
            if (input.files.length === 0) return;
            
            const file = input.files[0];
            if (file.size > 3 * 1024 * 1024) {
                input.value = '';
                return showToast("Para estabilidade, limite de 3MB excedido.", true);
            }

            transferindo = true;
            const radarAntigo = radarAtivo;
            radarAtivo = false; // Pausa a tela
            document.getElementById('upload-indicator').classList.remove('hidden');
            document.getElementById('upload-indicator').classList.add('flex');

            try {
                // Transforma o arquivo em Base64 para passar pelo cabo
                const base64 = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });

                const nomeSeguro = file.name.replace(/[^a-zA-Z0-9.-]/g, '_');
                const pathTmp = `/sdcard/temp_upload.txt`;
                const pathFinal = `/sdcard/Download/${nomeSeguro}`;

                await runAdbShell(`rm -f ${pathTmp}`);
                
                // Envia em blocos para não travar o shell do Android
                const chunkSize = 2048;
                for (let i = 0; i < base64.length; i += chunkSize) {
                    const chunk = base64.substring(i, i + chunkSize);
                    await runAdbShell(`echo -n '${chunk}' >> ${pathTmp}`);
                }

                // Decodifica e limpa
                await runAdbShell(`base64 -d ${pathTmp} > ${pathFinal}`);
                await runAdbShell(`rm -f ${pathTmp}`);

                // Magia de Compartilhamento do Android (Share Sheet Universal)
                // -t "*/*" = Aceita qualquer tipo
                // FLAG 1 = Dar permissão de leitura para o app que abrir
                await runAdbShell("input keyevent 224"); // Acorda a tela
                const intentCmd = `am start -a android.intent.action.SEND -t "*/*" -f 1 --eu android.intent.extra.STREAM "file://${pathFinal}"`;
                await runAdbShell(intentCmd);

                showToast("Arquivo pronto! Escolha o App na tela do celular.");
            } catch (err) {
                showToast("Erro ao enviar: " + err.message, true);
            }

            document.getElementById('upload-indicator').classList.add('hidden');
            document.getElementById('upload-indicator').classList.remove('flex');
            input.value = '';
            transferindo = false;
            
            // Volta a tela
            if(radarAntigo) { radarAtivo = true; loopRadarBase64(); }
        }

        // === 3. RADAR DE TELA (NOVO MÉTODO BASE64 - LENTO, PORÉM 100% ESTÁVEL) ===
        function toggleRadar() {
            if (!isAdbReady) return showToast("Conecte o USB.", true);
            radarAtivo = !radarAtivo;
            const btn = document.getElementById('btn-radar');
            
            if (radarAtivo) {
                btn.innerHTML = `<i class="fa-solid fa-pause text-lg w-5 text-center text-sky-400"></i><span class="font-medium text-sky-400 hidden md:block">Pausar Espelhamento</span>`;
                document.getElementById('screen-overlay').classList.add('hidden');
                loopRadarBinario();
            } else {
                btn.innerHTML = `<i class="fa-solid fa-play text-lg w-5 text-center"></i><span class="font-medium hidden md:block">Ligar Espelhamento</span>`;
            }
        }

        async function loopRadarBinario() {
            if (!radarAtivo || transferindo) return;
            
            try {
                // Usamos 'exec:' em vez de 'shell:' para remover o lag do terminal (PTY)
                // O Android vai nos enviar os bytes puros do PNG diretamente.
                const myId = localIdCounter++;
                await sendPacket(0x4E45504F, myId, 0, new TextEncoder().encode("exec:screencap -p\0"));
                
                let chunks = [];
                let waitClose = true;

                while(waitClose && radarAtivo) {
                    let r = await readPacket();
                    if(!r || r.error) break;
                    
                    if(r.cmd === 0x45545257 && r.arg1 === myId) { // WRTE (Dados da tela chegando)
                        await sendPacket(0x59414B4F, myId, r.arg0); // Confirma recebimento
                        if(r.data.length > 0) chunks.push(r.data);
                    }
                    if(r.cmd === 0x45534C43 && r.arg1 === myId) { // CLSE (Fim do frame)
                        await sendPacket(0x45534C43, myId, r.arg0);
                        waitClose = false;
                    }
                }

                // Junta todos os pedaços da imagem em um único bloco de memória (Buffer)
                const totalLen = chunks.reduce((acc, c) => acc + c.length, 0);
                if (totalLen > 1000) {
                    const imgData = new Uint8Array(totalLen);
                    let offset = 0;
                    for(let c of chunks) {
                        imgData.set(c, offset);
                        offset += c.length;
                    }
                    
                    // Renderiza instantaneamente o binário no navegador sem Base64!
                    const blob = new Blob([imgData], { type: 'image/png' });
                    const url = URL.createObjectURL(blob);
                    const img = document.getElementById('android-screen');
                    
                    // Pre-loading para esconder o "piscar" (flicker) da tela trocando
                    const tempImg = new Image();
                    tempImg.onload = () => {
                        img.src = url;
                        // Libera memória para o navegador não travar com milhares de imagens
                        if (img.dataset.oldUrl) URL.revokeObjectURL(img.dataset.oldUrl);
                        img.dataset.oldUrl = url;
                    };
                    tempImg.src = url;
                }
            } catch (e) {}

            // Atualiza rapidamente o próximo frame (Puxa os frames sem delay)
            setTimeout(loopRadarBinario, 30); 
        }

        // Interação de Mouse
        document.getElementById('touch-area').addEventListener('mousedown', async function(e) {
            if (!isAdbReady) return;
            const img = document.getElementById('android-screen');
            if(!img.src) return;

            const rect = img.getBoundingClientRect();
            const percX = (e.clientX - rect.left) / rect.width;
            const percY = (e.clientY - rect.top) / rect.height;

            // Envia Tap Baseado na Proporção
            // Resolução base genérica, o Android escala automaticamente
            const finalX = Math.floor(percX * 1080);
            const finalY = Math.floor(percY * 2400);

            await runAdbShell(`input tap ${finalX} ${finalY}`);
        });

        // === 4. COMUNICAÇÃO WEBUSB RSA (NÃO ALTERAR) ===
        async function getAdbKeyPair() { 
            return await crypto.subtle.generateKey({ name: "RSASSA-PKCS1-v1_5", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" }, true, ["sign", "verify"]); 
        }
        async function signAdbToken(keyPair, token) { 
            return new Uint8Array(await crypto.subtle.sign("RSASSA-PKCS1-v1_5", keyPair.privateKey, token)); 
        }
        async function getAdbPublicKeyPayload(keyPair) {
            const exported = await crypto.subtle.exportKey("jwk", keyPair.publicKey);
            const binaryStr = atob(exported.n.replace(/-/g, '+').replace(/_/g, '/'));
            const modBytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) modBytes[i] = binaryStr.charCodeAt(i);
            let n = 0n; for (let i = 0; i < modBytes.length; i++) n = (n << 8n) | BigInt(modBytes[i]);
            const r32 = 1n << 32n, n0 = n % r32;
            let inv = 1n; for (let i = 0; i < 32; i++) inv = (inv * (2n - n0 * inv)) % r32;
            const buffer = new ArrayBuffer(524), view = new DataView(buffer), bytes = new Uint8Array(buffer);
            view.setUint32(0, 64, true); view.setUint32(4, Number((r32 - inv) % r32), true);
            let tempN = n; for (let i = 0; i < 256; i++) { bytes[8 + i] = Number(tempN & 0xffn); tempN >>= 8n; }
            let tempRR = ((1n << 2048n) * (1n << 2048n)) % n; for (let i = 0; i < 256; i++) { bytes[264 + i] = Number(tempRR & 0xffn); tempRR >>= 8n; }
            view.setUint32(520, 65537, true);
            const nameBytes = new TextEncoder().encode("EspelhaAi_Web\0");
            const fullPayload = new Uint8Array(buffer.byteLength + nameBytes.length);
            fullPayload.set(bytes, 0); fullPayload.set(nameBytes, buffer.byteLength); 
            return fullPayload;
        }
        async function sendPacket(cmd, arg0, arg1, data = new Uint8Array(0)) {
            if (!usbDevice || !epOut) return;
            const header = new ArrayBuffer(24), view = new DataView(header);
            let checksum = 0; for (let i = 0; i < data.length; i++) checksum = (checksum + data[i]) & 0xffffffff;
            view.setUint32(0, cmd, true); view.setUint32(4, arg0, true); view.setUint32(8, arg1, true);
            view.setUint32(12, data.length, true); view.setUint32(16, checksum, true); view.setUint32(20, (cmd ^ 0xffffffff) >>> 0, true);
            const buffer = new Uint8Array(24 + data.length); 
            buffer.set(new Uint8Array(header), 0); buffer.set(data, 24);
            await usbDevice.transferOut(epOut, buffer);
        }
        
        async function readPacket() {
            if (!usbDevice || !epIn) return null;
            try {
                const head = await usbDevice.transferIn(epIn, 24);
                if (!head.data || head.data.byteLength < 24) return null;
                const view = new DataView(head.data.buffer);
                const cmd = view.getUint32(0, true), arg0 = view.getUint32(4, true), arg1 = view.getUint32(8, true), len = view.getUint32(12, true);
                
                // NOVO: Garantia de leitura completa do pacote USB.
                // Se a imagem for muito pesada, a porta USB envia fatiada. 
                // Esse Loop impede a "Tela Preta" reconstruindo os pedaços.
                let payload = new Uint8Array(len);
                let bytesLidos = 0;
                while (bytesLidos < len) {
                    const dat = await usbDevice.transferIn(epIn, len - bytesLidos);
                    if (dat.data && dat.data.byteLength > 0) {
                        payload.set(new Uint8Array(dat.data.buffer), bytesLidos);
                        bytesLidos += dat.data.byteLength;
                    } else {
                        break;
                    }
                }
                return { cmd, arg0, arg1, data: payload };
            } catch (e) { return { error: true, msg: e.message }; }
        }

        async function conectarUSB() {
            try {
                usbDevice = await navigator.usb.requestDevice({ filters: [{ classCode: 255, subclassCode: 66, protocolCode: 1 }] });
                await usbDevice.open();
                if (usbDevice.configuration === null) await usbDevice.selectConfiguration(1);
                let intfNum = -1;
                for (const conf of usbDevice.configurations) { for (const intf of conf.interfaces) { for (const alt of intf.alternates) {
                    if (alt.interfaceClass === 255 && alt.interfaceSubclass === 66 && alt.interfaceProtocol === 1) {
                        intfNum = intf.interfaceNumber; epIn = alt.endpoints.find(e => e.direction === 'in').endpointNumber; epOut = alt.endpoints.find(e => e.direction === 'out').endpointNumber; break;
                    } 
                } } }
                
                await usbDevice.claimInterface(intfNum);
                await sendPacket(0x4E584E43, 0x01000000, 4096, new TextEncoder().encode("host::EspelhaAi\0"));
                
                let keyPair = await getAdbKeyPair();
                let resp = await readPacket();
                
                if (resp && resp.cmd === 0x4E584E43) isAdbReady = true; 
                else if (resp && resp.cmd === 0x48545541 && resp.arg0 === 1) { 
                    await sendPacket(0x48545541, 2, 0, await signAdbToken(keyPair, resp.data));
                    let resp2 = await readPacket();
                    if (resp2 && resp2.cmd === 0x4E584E43) isAdbReady = true;
                    else {
                        await sendPacket(0x48545541, 3, 0, await getAdbPublicKeyPayload(keyPair));
                        showToast("Aceite a depuração na tela do celular!", true);
                        while(!isAdbReady) { 
                            let waitResp = await readPacket(); 
                            if(waitResp && waitResp.error) return showToast("Aparelho desconectado.", true); 
                            if(waitResp && waitResp.cmd === 0x4E584E43) isAdbReady = true; 
                        }
                    }
                }
                
                if (isAdbReady) {
                    document.getElementById('status-box').classList.remove('hidden');
                    document.getElementById('status-box').classList.add('flex');
                    document.getElementById('btn-conectar').classList.add('hidden');
                    
                    // --- FUNÇÃO ESCONDIDA: BLINDAGEM DE TELA ---
                    requestWakeLock(); // Mantém o PC acordado
                    await runAdbShell("settings put global stay_on_while_plugged_in 3"); // Mantém celular ligado no USB
                    await runAdbShell("settings put system screen_off_timeout 2147483647"); // Timeout infinito
                    await runAdbShell("input keyevent 224"); // Acorda a tela instantaneamente
                    
                    showToast("Celular Conectado com Sucesso!");
                }
            } catch (e) { showToast("Erro USB: " + e.message, true); }
        }
        
        async function runAdbShell(command) {
            if (!isAdbReady) return false;
            try {
                const myId = localIdCounter++;
                await sendPacket(0x4E45504F, myId, 0, new TextEncoder().encode("shell:" + command + "\0"));
                for(let i = 0; i < 4; i++) {
                    let r = await readPacket(); 
                    if(r && r.error) continue;
                    if(r && r.cmd === 0x45534C43) { await sendPacket(0x45534C43, myId, r.arg0); break; }
                }
                return true;
            } catch(e) { return false; }
        }
        window.runAdbShell = runAdbShell;
    </script>
</body>
</html>
